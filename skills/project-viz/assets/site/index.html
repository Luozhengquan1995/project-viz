<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
<title>Project Viz · 项目图谱</title><meta name="description" content="在一张可缩放的项目图中查看工作、公开执行记录与相关文件。">
<link rel="stylesheet" href="/flow.css"><script src="/flow-labels.js" defer></script><script src="/flow.js" defer></script>
</head>
<body>
<header class="app-header">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12h6m2-2 5-5m-5 9 5 5" stroke="currentColor" stroke-width="1.5"/><circle cx="4" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><circle cx="19" cy="4" r="2" fill="currentColor"/><circle cx="19" cy="20" r="2" fill="currentColor"/></svg></span><span id="project-name">Project Viz</span></a>
  <div class="header-center"><span id="connection" class="connection" data-state="starting"><i aria-hidden="true"></i><span id="connection-label">正在连接</span></span><span class="header-divider" aria-hidden="true"></span><span id="current-dot" class="current-dot" hidden aria-hidden="true"></span><button id="activity-summary" class="activity-link" type="button" aria-label="定位正在执行的任务" title="在项目图谱中定位正在执行的任务">正在读取最新工作…</button></div>
  <details id="coverage" class="coverage"><summary id="coverage-label" aria-label="查看采集覆盖情况">覆盖待确认</summary><div id="coverage-content" class="coverage-content"><p>正在读取采集范围。</p></div></details>
</header>
<main class="graph-app">
  <div class="graph-toolbar">
    <nav id="breadcrumbs" class="breadcrumbs" aria-label="所选工作路径"><span>项目图谱</span></nav>
    <div class="toolbar-right"><label class="follow-control"><input id="follow-current" type="checkbox"><span class="switch" aria-hidden="true"></span><span>跟随当前</span></label><div class="search-wrap"><label class="search"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5"/></svg><span class="sr-only">搜索并定位节点</span><input id="node-search" type="search" autocomplete="off" placeholder="搜索节点，定位到工作" aria-controls="search-results" aria-expanded="false"></label><div id="search-results" class="search-results" hidden></div></div></div>
  </div>
  <div id="offline-notice" class="offline-notice" hidden role="status"><span id="offline-message">连接暂时中断，已保留当前图谱。</span><button id="retry-button" type="button">重新连接</button></div>
  <section id="flow-canvas" class="flow-canvas" aria-label="可平移缩放的项目图谱" tabindex="0">
    <div id="flow-world" class="flow-world"><svg id="flow-edges" class="flow-edges" aria-hidden="true"><defs><marker id="edge-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 9 5 1 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linejoin="round"/></marker></defs><g id="edge-layer"></g></svg><div id="node-layer"></div></div>
    <div id="canvas-empty" class="canvas-empty"><span class="loading-ring" aria-hidden="true"></span><p>正在加载项目图谱</p><small>项目工作与公开记录将以节点和连线显示</small></div>
    <div class="canvas-instruction" aria-hidden="true">单击展开/收起 · ⓘ 查看详情 · 双击聚焦 · 滚轮缩放</div>
    <button id="selected-detail" class="selection-detail" type="button" hidden>查看所选节点详情 <span aria-hidden="true">↗</span></button>
    <div class="canvas-bottom"><div class="zoom-controls" aria-label="画布缩放"><button id="zoom-out" type="button" aria-label="缩小画布" title="缩小">−</button><button id="zoom-reset" type="button" aria-label="恢复百分之百缩放" title="恢复 100%"><span id="zoom-label">100%</span></button><button id="zoom-in" type="button" aria-label="放大画布" title="放大">+</button><span class="zoom-divider" aria-hidden="true"></span><button id="fit-view" class="fit-button" type="button" aria-label="适应当前视图" title="适应当前视图"><svg viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M2 6V2h4m6 0h4v4m0 6v4h-4m-6 0H2v-4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span>适应视图</span></button></div><span id="canvas-note" class="canvas-note">连线表示工作层级</span></div>
    <div class="minimap-wrap"><div class="minimap-label">导航小地图</div><svg id="minimap" aria-label="项目导航小地图，可点击或拖动视口导航" tabindex="0"><g id="minimap-nodes"></g><rect id="minimap-window" x="0" y="0" width="0" height="0" rx="4"/></svg></div>
  </section>
  <aside class="status-legend" aria-label="节点状态图例">
    <span class="legend-item" data-visual-status="active" title="正在工作：当前仍有执行活动"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path class="legend-fill" d="m6.5 4.9 4.3 3.1-4.3 3.1Z"/></svg><span>正在工作</span></span>
    <span class="legend-item" data-visual-status="done" title="已经做了：执行轮次已经结束，不代表目标成功或结果已验证"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1"/><rect class="legend-fill" x="5.8" y="5.8" width="4.4" height="4.4" rx=".3"/></svg><span>已经做了</span></span>
    <span class="legend-item" data-visual-status="error" title="失败：执行报错，或已有证据表明对应条件未通过"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 1.4 6.6 6.6L8 14.6 1.4 8Z"/><path d="m5.8 5.8 4.4 4.4m0-4.4-4.4 4.4"/></svg><span>失败</span></span>
    <span class="legend-item" data-visual-status="success" title="成功：有明确结果支持成功判断，与执行结束分开表示"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m8 1.3 2.1 1.1 2.4.4.4 2.4L14 8l-1.1 2.1-.4 2.4-2.4.4L8 14l-2.1-1.1-2.4-.4-.4-2.4L2 8l1.1-2.1.4-2.4 2.4-.4Z"/><path d="m5.1 7.9 2 2.1 3.9-4"/></svg><span>成功</span></span>
    <details class="legend-extras"><summary aria-label="查看等待与待确认状态说明" title="等待、未开展与待确认">?</summary><div class="legend-popover"><span data-visual-status="waiting"><i class="legend-clock" aria-hidden="true"></i><b>等待</b><small>等待输入、授权或执行结果</small></span><span data-visual-status="planned"><i class="legend-dashed" aria-hidden="true"></i><b>未开展</b><small>尚未开始的工作</small></span><span data-visual-status="partial"><i class="legend-question" aria-hidden="true">?</i><b>待确认</b><small>结果或证据仍需核验</small></span></div></details>
  </aside>
</main>
<dialog id="detail-drawer" class="detail-drawer" aria-labelledby="detail-title"><div class="drawer-header"><span id="detail-kicker">节点详情</span><button id="close-detail" type="button" aria-label="关闭详情">×</button></div><div id="drawer-content" class="drawer-content"></div></dialog>
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
