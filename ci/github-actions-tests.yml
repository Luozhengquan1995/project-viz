name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python syntax
        run: python -m compileall -q skills/project-viz/scripts tools tests
      - name: Behavior tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build allowlisted release bundles
        run: python tools/build_release.py --version 0.2.0 --output-dir dist

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Synthetic browser regression
        run: python -m unittest discover -s tests -p "test_browser.py" -v
